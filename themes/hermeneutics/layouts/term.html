{{- define "main" -}}
  <main>
    <header class="default-header">
      <h1 class="default-title">{{- .Title -}}</h1>
      <p class="default-counter">N = {{ len .Pages }}</p>
    </header>
    <div class="post-list">
      {{- range .Pages.GroupByDate "2006" -}}
        <section aria-labelledby="year-{{ .Key }}" class="post-list-group">
          <header>
            <h2 id="year-{{ .Key }}">
              <time>{{- .Key -}}</time>
            </h2>
            <div class="divider" aria-hidden="true"></div>
          </header>
          {{- partial "components/post-list.html" .Pages -}}
        </section>
      {{- end -}}
    </div>
  </main>
{{- end -}}
